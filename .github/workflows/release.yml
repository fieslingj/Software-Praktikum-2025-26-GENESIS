name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/Genesis/Genesis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Publish self-contained build
        run: dotnet publish -c Release -r win-x64 --self-contained true -o publish

      - name: Zip build output
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath ${{ github.workspace }}\Genesis-win-x64.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Genesis-win-x64.zip
